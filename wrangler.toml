# Reuse the Worker already owned by this Cloudflare account.
name = "shosholozatrail"
main = "src/worker.ts"
compatibility_date = "2026-09-07"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
html_handling = "none"

[vars]
# Already public/hardcoded client-side in app/src/auth/supabase.ts - the Worker
# needs it too, to fetch Supabase's public JWKS and verify session tokens.
SUPABASE_URL = "https://qchbcokqfsclivvchquj.supabase.co"
AI_ENABLED = "true"
AI_VALIDATED = "false"
AI_EXPERIMENTAL = "true"
AI_PROVIDER = "workers-ai"
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
AI_GLOBAL_DAILY_LIMIT = "1000"
AI_GUEST_DAILY_LIMIT = "20"
AI_SESSION_DAILY_LIMIT = "20"

# This binding uses the account's Workers AI allocation and does not expose a
# provider API key to the Worker or browser.
[ai]
binding = "AI"
remote = true

[[d1_databases]]
binding = "DB"
database_name = "shosholoza-trail-pilot"
database_id = "95940d95-bd11-4635-8007-cdb8d4082deb"
migrations_dir = "migrations"
